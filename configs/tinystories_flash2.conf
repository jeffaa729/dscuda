# BF16 dense GPT training with fused causal FlashAttention-style attention.
mode = tinystories
precision = bf16
attention = flash2
data-dir = data/tinystories
output-dir = checkpoints/tinystories_flash2

layers = 4
hidden = 256
heads = 4
ffn = 768
rotary = 64
batch = 4
seq = 256

steps = 3000
lr = 0.0003
max-grad-norm = 1.0
log-every = 100
checkpoint-every = 1000
peak-tflops = 58.25
seed = 1337
