# Parameter-matched dense GPT baseline for the DeepSeek-V3 TinyStories demo.
architecture = dense
mode = tinystories
precision = fp32
attention = flash2
data-dir = data/tinystories
output-dir = checkpoints/tinystories_dense_matched

layers = 7
hidden = 256
# FlashAttention is specialized for hidden / heads = 128.
heads = 2
ffn = 800
rotary = 64
batch = 2
seq = 128

steps = 5000
lr = 0.0003
max-grad-norm = 1.0
log-every = 100
checkpoint-every = 1000
peak-tflops = 14.56
seed = 1337
