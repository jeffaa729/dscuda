# Larger 8-layer dense GPT TinyStories training run for an 8 GiB GPU.
mode = tinystories
precision = fp32
data-dir = data/tinystories
output-dir = checkpoints/dense_gpt_8l_512h

layers = 8
hidden = 512
heads = 8
ffn = 1536
rotary = 64
batch = 2
seq = 256

steps = 5000
lr = 0.0003
max-grad-norm = 1.0
log-every = 100
checkpoint-every = 1000
peak-tflops = 14.56
seed = 1337
