# Small single-GPU DeepSeek-V3 configuration for correctness and architecture comparisons.
architecture = deepseek_v3
mode = tinystories
data-dir = data/tinystories
output-dir = checkpoints/tinystories_v3_complete
steps = 5000
batch = 2
seq = 128
layers = 4
hidden = 256
heads = 4
query-rank = 128
kv-rank = 64
nope-size = 32
rope-size = 32
value-size = 32
expert-hidden = 256
routed-experts = 8
shared-experts = 1
top-k = 2
dense-layers = 3
dense-ffn = 768
route-scale = 1.0
routing-bias-speed = 0.001
balance-loss-weight = 0.0001
mtp-depth = 1
mtp-loss-weight = 0.1
lr = 0.0003
max-grad-norm = 1.0
peak-tflops = 14.56
log-every = 100
checkpoint-every = 1000
seed = 1337
