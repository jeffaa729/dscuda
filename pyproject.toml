[project]
name = "dscuda-kernel-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flash-attn>=2.8.3.post1",
    "numpy>=2.2.6",
    "torch>=2.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
flash-attn = { index = "astral-cu128" }

[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128/"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
